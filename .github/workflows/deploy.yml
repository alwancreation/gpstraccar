name: Deploy to Production

on:
  push:
    branches:
      - main
      - master
  # Permet de relancer un déploiement à la main (onglet Actions > Run workflow)
  workflow_dispatch:

# Un seul déploiement à la fois ; un second attend la fin du premier au lieu de l'interrompre.
concurrency:
  group: traccar-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Traccar to Debian Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build server (tracker-server.jar + lib)
        run: ./gradlew assemble --no-daemon --stacktrace

      # L'interface web vient du dépôt officiel traccar/traccar-web, au commit référencé par le sous-module « traccar-web ».
      - name: Checkout web interface
        run: |
          WEB_SHA="$(git ls-tree HEAD traccar-web | awk '{print $3}')"
          git clone --quiet https://github.com/traccar/traccar-web.git web-src
          if [ -n "$WEB_SHA" ] && git -C web-src checkout --quiet "$WEB_SHA"; then
            echo "traccar-web au commit $WEB_SHA"
          else
            echo "::warning::commit $WEB_SHA introuvable dans traccar/traccar-web, branche par défaut utilisée"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web interface
        working-directory: web-src
        run: npm ci --no-audit --no-fund && npm run build

      - name: Package
        run: |
          set -e
          mkdir -p out/lib out/schema out/templates/translations out/web
          cp target/tracker-server.jar out/
          cp target/lib/* out/lib/
          cp schema/* out/schema/
          cp -r templates/* out/templates/
          cp -r web-src/build/* out/web/
          cp -r web-src/src/resources/l10n/* out/templates/translations/
          cp setup/traccar.service out/
          # JRE minimal embarqué : le serveur n'a pas besoin d'avoir Java installé.
          jlink --add-modules java.se,jdk.charsets,jdk.crypto.ec,jdk.net,jdk.unsupported \
            --strip-debug --no-header-files --no-man-pages --compress=2 --output out/jre
          tar -czf traccar-package.tar.gz -C out .
          cp deploy/install.sh install.sh
          ls -lh traccar-package.tar.gz

      # Mêmes actions et mêmes secrets que le dépôt gpstracker : appleboy accepte la clé quel que soit son format de collage
      # (fins de ligne Windows, etc.), là où « ssh -i » échouait avec « Load key: error in libcrypto ».
      - name: Upload package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_SERVER_KEY }}
          source: "traccar-package.tar.gz,install.sh"
          target: /tmp/traccar-deploy-${{ github.run_id }}

      - name: Install on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_SERVER_KEY }}
          command_timeout: 30m
          script: |
            DIR="/tmp/traccar-deploy-${{ github.run_id }}"
            sudo bash "$DIR/install.sh" "$DIR/traccar-package.tar.gz"
            status=$?
            rm -rf "$DIR"
            exit $status
